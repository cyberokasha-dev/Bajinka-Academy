name: Learner web and APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  learner:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/learner
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate web and Android platforms
        run: flutter create --platforms=web,android --org=com.bajinka --project-name=bajinka_academy .
      - name: Configure learner Android permissions and notifications
        run: python ../../scripts/configure_learner_android.py
      - run: flutter pub get
      - name: Save resolved dependency lock
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: learner-dependency-lock
          path: apps/learner/pubspec.lock
          if-no-files-found: error
      - run: flutter analyze
      - run: flutter test
      - name: Check runner comparison rules
        run: node ../../scripts/test_learner_runner.cjs
      - name: Check worker execution wrapper
        run: python ../../scripts/test_learner_worker.py
      - name: Check extended lesson examples and reference cases
        run: python ../../scripts/test_extended_content.py
      - name: Build learner website
        run: flutter build web
      - name: Version web assets and retire stale cache
        run: python ../../scripts/prepare_learner_web.py "$GITHUB_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bajinka-academy-learner-web
          path: apps/learner/build/web
          if-no-files-found: error
      - name: Build test APK
        run: flutter build apk --debug
      - name: Upload test APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bajinka-academy-test-apk
          path: apps/learner/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

