name: Academy web checks and downloads
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  learner:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/learner
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Generate web platform
        run: flutter create --platforms=web --org=com.bajinka --project-name=bajinka_academy .
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build learner website
        run: flutter build web
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bajinka-academy-learner-web
          path: apps/learner/build/web
          if-no-files-found: error
  admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: node --check apps/admin/app.js
      - run: python3 -m json.tool shared/course-map.json > /dev/null
      - name: Upload admin website
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bajinka-academy-admin-web
          path: apps/admin
          if-no-files-found: error
